# How Netlify builds and serves the site: the command, the folder it publishes,
# and the headers a static file cannot carry. Without it Netlify would guess a
# build and serve every page with no security headers.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    # There is no Content-Security-Policy here, on purpose. The whole policy is
    # sent from dist/_headers, which the build writes (src/build/write-headers.mjs)
    # because it holds the hash of every inline script and style of every page,
    # and only the build knows those. It is named in that one place: Netlify's
    # documentation does not say whether a header named in both this file and
    # _headers is merged, joined or overridden, so none is named twice, and a
    # change to the policy is made in one file and read in one. frame-ancestors,
    # which a meta tag cannot carry, is in that policy too.

    # X-Frame-Options is the older spelling of frame-ancestors, which the
    # policy in _headers carries, for the browsers that only ever learned this
    # one.
    X-Frame-Options = "DENY"

    # Two years, subdomains included, and eligible for the preload list. Only
    # meaningful over HTTPS, which is the only way Netlify serves this.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # Severs the window.opener relationship, so a page this one opens, or one
    # that opens this one, cannot reach into it.
    Cross-Origin-Opener-Policy = "same-origin"

    # Nobody else's page gets to embed these bytes. The site loads every asset
    # it needs from its own origin, so nothing legitimate is refused.
    Cross-Origin-Resource-Policy = "same-origin"

    # Content-Type is authoritative. Without this a browser may decide a file
    # is a script because it looks like one.
    X-Content-Type-Options = "nosniff"

    # Same-origin navigations get the full URL, cross-origin ones get the bare
    # origin, and an HTTPS-to-HTTP downgrade gets nothing.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # This site is pictures and text. It has no reason to ask for a camera, a
    # location or a payment sheet, so the answer is settled here rather than at
    # the prompt. The one exception is autoplay, allowed to the site's own pages
    # (self) and to no other origin: the moving hero's loop is a muted video
    # that starts by itself once the page has loaded, and a policy that refuses
    # autoplay to every origin is one a browser may take as reason to refuse it
    # (tests/e2e/header-policy.spec.ts holds that the hero plays under this
    # value). The hero has a Pause button and is not started for a reader who
    # asked for less motion or to spare data.
    Permissions-Policy = "accelerometer=(), autoplay=(self), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()"
